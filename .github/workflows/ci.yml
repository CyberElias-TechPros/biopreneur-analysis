name: CI

# The repo had no pipeline, so every gate in `faith-site/scripts/` was a habit
# rather than an enforcement. This runs the same gates a human runs locally,
# on every pull request, and refuses to pass if any of them fails.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, audit, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: faith-site

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: faith-site/package-lock.json

      - name: Set up Python (for the content verifiers)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Astro + TypeScript)
        run: npm run typecheck

      - name: Content audit — 20 gates per article
        run: npm run audit

      - name: Listening Room regression suite
        run: npm run test:listening

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://lij.name.ng

      - name: Post-build SEO audit — 34 checks against dist/
        run: npm run seo

      - name: Site tests — search index, dialog, health, 404 recovery
        run: npm run test:site

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: faith-site/dist
          retention-days: 3
