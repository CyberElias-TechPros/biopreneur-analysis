  <!-- Subtle vertical light axis (cross-horizon motif) -->
  <line x1="32" y1="13" x2="32" y2="49" stroke="#EDE8DF" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="24" y1="22" x2="40" y2="22" stroke="#D4AF6A" stroke-width="1.5" stroke-linecap="round"/>
  <defs>
    <radialGradient id="dawn" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#D4AF6A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
