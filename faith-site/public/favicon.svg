<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#0D1117"/>
  <circle cx="32" cy="36" r="18" fill="url(#dawn)" opacity="0.55"/>
  <!-- Horizon rule -->
  <line x1="10" y1="40" x2="54" y2="40" stroke="#D4AF6A" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Rising dawn arc -->
